<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="choose_mail.css">
</head>

<body>
  <div id="notification" style="
        position: fixed; 
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 15px;
        border-radius: 5px;
        background-color: #333;
        color: white;
        font-weight: bold;
        display: none;
        z-index: 9999;
        box-shadow: 0px 2px 6px rgba(0,0,0,0.3);
        font-size: 14px;
    "></div>

  <label for="customMail">Custom local part:</label>
  <input type="email" id="emailPrefix" name="emailPrefix" class="custom-width" placeholder="optional">
  <br><br>

  <button id="createMail">Create & copy</button>
  <button id="openForwarders" title="All forwarders">📄</button>
  <button id="openOptions" title="Options">⚙️</button>

  <script type="module" src="choose_mail.js"></script>

  <ul id="forwarderList"></ul>
</body>

</html>
