<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options</title>
</head>
<body>
    <div>
        <h1>Configuration:</h1>
        <p class="info">You can get a key <a href="https://pixel.mxrouting.net:2222/evo/user/login-keys/keys" target="_blank">here</a>.</p>
        <form id="configForm">
            <label for="subdomain">MX subdomain:</label>
            <input type="text" id="subdomain" name="subdomain"><br>
            <small>Example: <strong>pixel</strong></small><br><br>
            
            <label for="user">Username:</label>
            <input type="text" id="user" name="user"><br>
            <small>Example: <strong>username</strong></small><br><br>
            
            <label for="key">Key:</label>
            <input type="password" id="key" name="key"><br>
            <small>Example: <strong>gjhbdfgjerzvtntil7tugbnzes67urgubnhrx7rxutrz6bn8</strong></small><br><br>
            
            <label for="user_domain">Domainending:</label>
            <input type="text" id="user_domain" name="user_domain"><br>
            <small>Example: <strong>example.de</strong></small><br><br>
            
            <label for="receiver">Receiver:</label>
            <input type="email" id="receiver" name="receiver"><br>
            <small>Example: <strong>receiver@example.de</strong></small><br><br>
            
            <label for="domainInfo">Include Domain Info in alias?: </label>
            <input type="checkbox" id="domainInfo" name="domainInfo"><br><br>

            
            <button type="submit">Save</button>
        </form>
    </div>

    <script src="options.js"></script>
</body>
</html>
